[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-photo-sorter"
version = "3.1.1"
description = "Multilingual AI product photo sorter with CLI and Tkinter GUI"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Mohamed Anwar"}]
keywords = ["ai", "computer-vision", "product-photography", "photo-organizer", "image-classification", "product-catalog", "gemini", "openai", "anthropic", "multi-provider", "tkinter", "desktop-app", "cli", "api-key-rotation", "open-source"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "google-genai>=1,<2", "openpyxl>=3.1,<4", "keyring>=25,<27"]

[project.optional-dependencies]
# ONNX-based visual embeddings are deliberately optional: the normal sorter and
# packaged desktop builds stay lightweight until measured hybrid routing proves
# that the extra runtime/model footprint is justified.
local-embeddings = ["fastembed>=0.5,<1"]

[project.urls]
Homepage = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter"
Repository = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter"
Issues = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter/issues"
Changelog = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter/blob/main/CHANGELOG.md"

[project.scripts]
product-sorter = "ai_product_photo_sorter.cli:main"
product-sorter-setup = "ai_product_photo_sorter.setup_wizard:main"

[project.gui-scripts]
product-sorter-gui = "ai_product_photo_sorter.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sorter_core", "product_sorter", "product_sorter_gui", "set_data", "providers", "professional", "i18n", "secrets_store", "model_catalog"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_product_photo_sorter = ["provider_models.json", "requirements.txt"]

[tool.setuptools.data-files]
"assets/branding" = ["assets/branding/product-sorter-48.png", "assets/branding/product-sorter-64.png", "assets/branding/product-sorter-128.png", "assets/branding/product-sorter-256.png"]
