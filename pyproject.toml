[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-photo-sorter"
version = "3.3.0"
description = "CatalogMesh multilingual AI workspace for product catalog operations, review, storage and guarded automation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Mohamed Anwar"}]
keywords = ["ai", "computer-vision", "product-photography", "photo-organizer", "image-classification", "product-catalog", "catalog-operations", "gemini", "openai", "anthropic", "multi-provider", "tkinter", "desktop-app", "cli", "api-key-rotation", "rclone", "cloud-storage", "open-source", "mcp", "automation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10,<13",
  "google-genai>=2.21.0,<3",
  "openpyxl>=3.1,<4",
  "keyring>=25,<27",
  "arabic-reshaper>=3,<4",
  "python-bidi>=0.6,<1",
]

[project.optional-dependencies]
local-embeddings = ["fastembed>=0.5,<1"]
local-evidence = ["numpy>=1.26,<3", "rapidocr>=3.9,<4", "onnxruntime>=1.27,<2", "zxing-cpp>=3.1,<4"]
mcp = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter"
Repository = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter"
Issues = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter/issues"
Changelog = "https://github.com/mhmdwaelanwr/ai-product-photo-sorter/blob/main/CHANGELOG.md"

[project.scripts]
product-sorter = "ai_product_photo_sorter.cli:main"
product-sorter-setup = "ai_product_photo_sorter.setup_wizard:main"
product-sorter-config = "ai_product_photo_sorter.config_cli:main"
product-sorter-reports = "ai_product_photo_sorter.reports_cli:main"
product-sorter-automation = "ai_product_photo_sorter.automation_cli:main"
product-sorter-storage = "ai_product_photo_sorter.storage_cli:main"
product-sorter-watch = "ai_product_photo_sorter.watch_daemon:main"
product-sorter-mcp = "ai_product_photo_sorter.mcp_server:main"
catalogmesh = "ai_product_photo_sorter.cli:main"
catalogmesh-setup = "ai_product_photo_sorter.setup_wizard:main"
catalogmesh-config = "ai_product_photo_sorter.config_cli:main"
catalogmesh-reports = "ai_product_photo_sorter.reports_cli:main"
catalogmesh-automation = "ai_product_photo_sorter.automation_cli:main"
catalogmesh-storage = "ai_product_photo_sorter.storage_cli:main"
catalogmesh-watch = "ai_product_photo_sorter.watch_daemon:main"
catalogmesh-mcp = "ai_product_photo_sorter.mcp_server:main"

[project.gui-scripts]
product-sorter-gui = "ai_product_photo_sorter.gui:main"
catalogmesh-gui = "ai_product_photo_sorter.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sorter_core", "product_sorter", "product_sorter_gui", "set_data", "providers", "professional", "i18n", "secrets_store", "model_catalog"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_product_photo_sorter = ["provider_models.json", "requirements.txt"]

[tool.setuptools.data-files]
"assets/branding" = ["assets/branding/product-sorter-48.png", "assets/branding/product-sorter-64.png", "assets/branding/product-sorter-128.png", "assets/branding/product-sorter-256.png"]
