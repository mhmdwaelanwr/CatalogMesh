name: build-and-release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            artifact: linux-x64
          - os: windows-latest
            label: windows-x64
            artifact: windows-x64
          - os: macos-15
            label: macos-arm64
            artifact: macos-arm64
          - os: macos-15-intel
            label: macos-x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build pyinstaller

      - name: Install application package
        run: python -m pip install -e .

      - name: Run automated tests
        run: python -m unittest discover -s tests -t . -v

      - name: Validate Python sources
        run: python -m compileall -q src product_sorter.py product_sorter_gui.py set_data.py scripts

      - name: Build Python distributions
        if: runner.os == 'Linux'
        run: python -m build

      - name: Verify README demo GIF
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        run: |
          cp docs/demo.gif "$RUNNER_TEMP/demo-before.gif"
          python scripts/build_demo_gif.py
          cmp --silent "$RUNNER_TEMP/demo-before.gif" docs/demo.gif || {
            echo "docs/demo.gif is out of date; run python scripts/build_demo_gif.py and commit it."
            exit 1
          }

      - name: Upload README demo GIF
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: readme-demo
          path: docs/demo.gif
          if-no-files-found: error

      - name: Build desktop application
        run: pyinstaller --clean --noconfirm packaging/pyinstaller/product_sorter.spec

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ProductSorterPro.exe -DestinationPath dist/ProductSorterPro-windows-x64.zip

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          test -x dist/ProductSorterPro
          tar -C dist -czf dist/ProductSorterPro-linux-x64.tar.gz ProductSorterPro
          bash packaging/linux/build_deb.sh

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        run: |
          test -d dist/ProductSorterPro.app
          file dist/ProductSorterPro.app/Contents/MacOS/ProductSorterPro
          case "${{ matrix.artifact }}" in
            macos-arm64) file dist/ProductSorterPro.app/Contents/MacOS/ProductSorterPro | grep -q 'arm64' ;;
            macos-x64) file dist/ProductSorterPro.app/Contents/MacOS/ProductSorterPro | grep -q 'x86_64' ;;
          esac

      - name: Verify macOS bundle version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          EXPECTED_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          PLIST="dist/ProductSorterPro.app/Contents/Info.plist"
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Expected version: $EXPECTED_VERSION"
          echo "CFBundleShortVersionString: $SHORT_VERSION"
          echo "CFBundleVersion: $BUNDLE_VERSION"
          test "$SHORT_VERSION" = "$EXPECTED_VERSION"
          test "$BUNDLE_VERSION" = "$EXPECTED_VERSION"

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ProductSorterPro.app dist/ProductSorterPro-${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ProductSorterPro-windows-x64
          path: |
            dist/ProductSorterPro.exe
            dist/ProductSorterPro-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: ProductSorterPro-linux-x64
          path: |
            dist/ProductSorterPro-linux-x64.tar.gz
            dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: python-dists
          path: dist/catalogmesh-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: ProductSorterPro-${{ matrix.artifact }}
          path: dist/ProductSorterPro-${{ matrix.artifact }}.zip
          if-no-files-found: error

  gui-smoke-windows:
    name: GUI smoke (Windows executable)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GUI automation dependencies
        run: python -m pip install --upgrade pywinauto pyautogui pillow psutil

      - name: Download packaged Windows executable
        uses: actions/download-artifact@v8
        with:
          name: ProductSorterPro-windows-x64
          path: gui-build/

      - name: Inspect packaged executable
        shell: pwsh
        run: |
          Get-ChildItem -Recurse gui-build
          if (-not (Test-Path "gui-build/ProductSorterPro.exe")) {
            throw "ProductSorterPro.exe was not found in the downloaded build artifact."
          }

      - name: Launch executable and capture GUI screenshots
        shell: pwsh
        run: |
          $args = @(
            "scripts/gui_smoke_windows.py",
            "--exe", "gui-build/ProductSorterPro.exe",
            "--output", "gui-artifacts",
            "--timeout", "60"
          )
          if (Test-Path "tests/visual/baseline/windows") {
            $args += @("--baseline-dir", "tests/visual/baseline/windows", "--visual-threshold", "0.08")
          }
          python @args

      - name: Upload GUI screenshots and smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots-windows
          path: gui-artifacts/
          if-no-files-found: warn

  verify-artifact-download:
    name: Verify release artifact download
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: artifact-check/

      - name: Verify downloaded distributions
        shell: bash
        run: |
          find artifact-check -maxdepth 1 -type f -print
          test -n "$(find artifact-check -maxdepth 1 -type f -name 'catalogmesh-*.whl' -print -quit)"
          test -n "$(find artifact-check -maxdepth 1 -type f -name 'catalogmesh-*.tar.gz' -print -quit)"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - build
      - gui-smoke-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release_context.outputs.publish }}
      version: ${{ steps.release_context.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve release context
        id: release_context
        shell: bash
        run: |
          publish=false
          version=""

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if git diff --name-only HEAD^ HEAD | grep -Fxq '.github/release-trigger'; then
              version=$(tr -d '[:space:]' < .github/release-trigger)
              package_version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' pyproject.toml | head -n 1)
              if [[ -z "$version" || "$version" != "v$package_version" ]]; then
                echo "Release trigger '$version' does not match project version 'v$package_version'." >&2
                exit 1
              fi
              publish=true
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$version" ]]; then
            echo "notes=docs/releases/${version#v}.md" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.release_context.outputs.publish == 'true'
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        if: steps.release_context.outputs.publish == 'true'
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        if: steps.release_context.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_context.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CatalogMesh ${{ steps.release_context.outputs.version }}
          body_path: ${{ steps.release_context.outputs.notes }}
          files: release-assets/*
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish CatalogMesh to PyPI
    if: needs.release.outputs.released == 'true'
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/catalogmesh/
    permissions:
      id-token: write
    steps:
      - name: Retrieve Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
