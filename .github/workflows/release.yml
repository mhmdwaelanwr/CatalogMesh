name: build-and-release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build pyinstaller

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Validate Python sources
        run: python -m py_compile sorter_core.py product_sorter.py product_sorter_gui.py scripts/build_demo_gif.py

      - name: Build Python distributions
        if: runner.os == 'Linux'
        run: python -m build

      - name: Verify README demo GIF
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        run: |
          cp docs/demo.gif "$RUNNER_TEMP/demo-before.gif"
          python scripts/build_demo_gif.py
          cmp --silent "$RUNNER_TEMP/demo-before.gif" docs/demo.gif || {
            echo "docs/demo.gif is out of date; run python scripts/build_demo_gif.py and commit it."
            exit 1
          }

      - name: Upload README demo GIF
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: readme-demo
          path: docs/demo.gif
          if-no-files-found: error

      - name: Build desktop application
        run: pyinstaller --clean --noconfirm product_sorter.spec

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ProductSorterPro.exe -DestinationPath dist/ProductSorterPro-windows-x64.zip

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          test -x dist/ProductSorterPro
          tar -C dist -czf dist/ProductSorterPro-linux-x64.tar.gz ProductSorterPro
          bash build_deb.sh

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          test -d dist/ProductSorterPro.app
          ditto -c -k --sequesterRsrc --keepParent dist/ProductSorterPro.app dist/ProductSorterPro-macos.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ProductSorterPro-windows-x64
          path: |
            dist/ProductSorterPro.exe
            dist/ProductSorterPro-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ProductSorterPro-linux-x64
          path: |
            dist/ProductSorterPro-linux-x64.tar.gz
            dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: python-dists
          path: dist/ai_product_photo_sorter-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ProductSorterPro-macos
          path: dist/ProductSorterPro-macos.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish Python package to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ai-product-photo-sorter/
    permissions:
      id-token: write
    steps:
      - name: Retrieve Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
