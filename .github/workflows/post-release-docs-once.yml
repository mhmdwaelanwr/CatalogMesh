name: post-release-docs-once

on:
  push:
    branches: ["chore/catalogmesh-post-release-docs"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/catalogmesh-post-release-docs
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate initial README hero
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          python scripts/generate_readme_hero.py \
            --source-dir docs/screenshots/ci/windows \
            --output docs/screenshots/ci/windows/readme-hero.png
          test -s docs/screenshots/ci/windows/readme-hero.png

      - name: Point README at automated hero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          old_hero = "![CatalogMesh desktop](docs/screenshots/ci/windows/light-01-operation.png)"
          new_hero = "![CatalogMesh desktop workspaces](docs/screenshots/ci/windows/readme-hero.png)\n\n<sub>Automatically generated from the latest canonical packaged-Windows GUI captures: Operation, Review, Storage and Automation.</sub>"
          if old_hero not in text:
              raise SystemExit("README hero marker not found")
          text = text.replace(old_hero, new_hero, 1)

          old_sync = "Light/dark packaged-Windows screenshots are generated by CI from the real packaged executable. After a successful `main` build, `gui-docs-sync` refreshes `docs/screenshots/ci/windows/` from that smoke-test artifact."
          new_sync = "Light/dark packaged-Windows screenshots are generated by CI from the real packaged executable. After a successful `main` build, `gui-docs-sync` refreshes `docs/screenshots/ci/windows/` from that smoke-test artifact and regenerates the README hero from the canonical Operation, Review, Storage and Automation captures. Visual-noise filtering prevents tiny hosted-runner rendering differences from creating documentation churn."
          if old_sync not in text:
              raise SystemExit("README GUI sync paragraph not found")
          text = text.replace(old_sync, new_sync, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README hero refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git add -f docs/screenshots/ci/windows/readme-hero.png
          git commit -m "docs: add automated CatalogMesh README hero"
          git push origin HEAD:chore/catalogmesh-post-release-docs

      - name: Update repository description and topics when permitted
        shell: bash
        run: |
          set +e

          description='CatalogMesh — local-first AI workspace for product-photo grouping, human review, SKU matching, exports, rclone storage, and guarded Shopify/Akeneo/Odoo automation.'
          repo_output="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f description="$description" 2>&1)"
          repo_status=$?

          topics_output="$(printf '%s' '{"names":["catalogmesh","ai","computer-vision","product-catalog","product-photography","photo-organizer","python","tkinter","desktop-app","cli","ollama","gemini","openai","anthropic","shopify","akeneo","odoo","rclone","mcp","local-first"]}' | gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" -H 'Accept: application/vnd.github+json' --input - 2>&1)"
          topics_status=$?

          if [ "$repo_status" -eq 0 ]; then
            echo "Repository description updated."
          else
            echo "::warning::Repository description update was not permitted for this Actions token: $repo_output"
          fi

          if [ "$topics_status" -eq 0 ]; then
            echo "Repository topics updated."
          else
            echo "::warning::Repository topics update was not permitted for this Actions token: $topics_output"
          fi

          {
            echo "## Repository metadata"
            echo
            echo "Description update status: $repo_status"
            echo "Topics update status: $topics_status"
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
