name: akeneo-execution-safety

on:
  pull_request:
  push:
    branches: [main]

jobs:
  akeneo-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Akeneo execution tests
        run: python -m unittest tests.test_akeneo_execution -v
      - name: MCP must not expose Akeneo execution
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/ai_product_photo_sorter/mcp_server.py').read_text(encoding='utf-8')
          forbidden = ('execute_akeneo_products', 'akeneo.apply_products', 'patch_product')
          found = [name for name in forbidden if name in text]
          if found:
              raise SystemExit(f'Forbidden Akeneo remote execution capability in MCP surface: {found}')
      - name: No generic connector executor
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/ai_product_photo_sorter/automation_cli.py').read_text(encoding='utf-8')
          if 'execute-connector' in text:
              raise SystemExit('Generic connector executor must not be introduced')
