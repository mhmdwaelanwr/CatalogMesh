name: one-time-release-housekeeping

on:
  push:
    branches:
      - chore/catalogmesh-release-title

permissions:
  contents: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Retitle current v3.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v3.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "CatalogMesh v3.3.0"
          test "$(gh release view v3.3.0 --repo "$GITHUB_REPOSITORY" --json name --jq .name)" = "CatalogMesh v3.3.0"

      - name: Delete fully merged legacy branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "chore/consolidate-branches-temp"
            "chore/consolidate-branches-temp2"
            "ci/live-provider-smoke-once"
            "feature/hybrid-embedding-shadow"
            "feature/ollama-local-first"
            "feature/performance-preprocess-pipeline"
            "release/v3.1.0"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting fully merged branch: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done

      - name: Verify legacy branches are gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "chore/consolidate-branches-temp"
            "chore/consolidate-branches-temp2"
            "ci/live-provider-smoke-once"
            "feature/hybrid-embedding-shadow"
            "feature/ollama-local-first"
            "feature/performance-preprocess-pipeline"
            "release/v3.1.0"
          )

          for branch in "${branches[@]}"; do
            if gh api "repos/$GITHUB_REPOSITORY/branches/$branch" >/dev/null 2>&1; then
              echo "Branch still exists: $branch" >&2
              exit 1
            fi
          done
