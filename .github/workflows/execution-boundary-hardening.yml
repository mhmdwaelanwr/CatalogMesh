name: execution-boundary-hardening

on:
  pull_request:
  push:
    branches: [main]

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run execution boundary hardening tests
        run: python -m unittest tests.test_execution_boundary_hardening -v
      - name: Block legacy Shopify mutation surfaces
        shell: bash
        run: |
          if grep -F "apply_shopify_publishing(_impl)" src/ai_product_photo_sorter/core.py; then
            echo "Legacy Shopify CLI mutation surface must remain disabled"
            exit 1
          fi
          if grep -F "apply_shopify_publishing_gui(_impl)" src/ai_product_photo_sorter/gui.py; then
            echo "Legacy Shopify GUI mutation surface must remain disabled"
            exit 1
          fi
          if grep -R "execute-connector\|execute-erp\|rollback-connector" src/ai_product_photo_sorter/automation_cli.py; then
            echo "Generic external execution commands are forbidden"
            exit 1
          fi
