name: gui-docs-sync

on:
  workflow_run:
    workflows: ["build-and-release"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: gui-docs-sync-main
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: ci/gui-docs-sync
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install visual diff dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"

      - name: Download GUI screenshot artifact from build workflow
        uses: actions/download-artifact@v8
        with:
          name: gui-screenshots-windows
          path: gui-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh tracked CI screenshots with visual noise filter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots/ci/windows

          # Windows hosted runners can introduce tiny border/anti-alias differences
          # between otherwise identical captures. Only replace tracked documentation
          # screenshots when the normalized RGB RMS delta is visually meaningful.
          python scripts/gui_docs_visual_sync.py \
            --candidate-dir gui-artifacts \
            --tracked-dir docs/screenshots/ci/windows \
            --threshold 0.005 \
            --report gui-docs-sync-report.json

          light_count="$(find docs/screenshots/ci/windows -maxdepth 1 -type f -name 'light-[0-9][0-9]-*.png' | wc -l)"
          dark_count="$(find docs/screenshots/ci/windows -maxdepth 1 -type f -name 'dark-[0-9][0-9]-*.png' | wc -l)"
          test "$light_count" -eq 12
          test "$dark_count" -eq 12

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("gui-docs-sync-report.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## GUI documentation visual sync\n\n")
              summary.write(f"Threshold: `{report['threshold']}`\n\n")
              summary.write(f"Meaningful changes: **{report['changed_count']}** / {report['expected_count']}\n\n")
              if report["changed"]:
                  summary.write("Changed screenshots:\n")
                  for item in report["changed"]:
                      summary.write(f"- `{item['file']}` — delta `{item['delta']}`\n")
              else:
                  summary.write("All canonical screenshots are already visually current.\n")
          PY

      - name: Commit screenshots on protected-sync branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # PNG is globally ignored for user catalog media. CI documentation images
          # are an intentional exception and must be force-added when first created.
          git add -A docs/screenshots/ci/windows
          git add -f docs/screenshots/ci/windows/light-[0-9][0-9]-*.png
          git add -f docs/screenshots/ci/windows/dark-[0-9][0-9]-*.png

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Screenshots already visually current."
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH"
          git commit -m "docs: refresh GUI screenshots from CI"
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or reuse screenshot refresh pull request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --base main --head "$SYNC_BRANCH" --json number --jq '.[0].number // empty')"
          body=$(cat <<'EOF'
          ## Automated GUI documentation refresh
          - generated from the successful packaged Windows GUI smoke on `main`
          - validates the exact 12 light + 12 dark canonical workflow screenshots
          - updates only screenshots whose normalized visual delta exceeds the CI noise threshold
          - no application code, release, tag, or version change
          - uses a PR because repository rules intentionally block direct writes to `main`

          The normal repository status checks and review/merge rules still apply.
          EOF
          )

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title "docs: refresh packaged Windows GUI screenshots" \
              --body "$body"
            echo "Updated screenshot PR #$existing"
            exit 0
          fi

          set +e
          create_output="$(gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "docs: refresh packaged Windows GUI screenshots" \
            --body "$body" 2>&1)"
          create_status=$?
          set -e

          if [ "$create_status" -eq 0 ]; then
            echo "$create_output"
            exit 0
          fi

          if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" <<<"$create_output"; then
            encoded_branch="${SYNC_BRANCH//\//%2F}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${encoded_branch}?expand=1"
            echo "::warning::Repository settings prevent GITHUB_TOKEN from creating pull requests. The refreshed screenshot branch is ready: $compare_url"
            {
              echo "## GUI screenshot refresh branch ready"
              echo
              echo "The meaningful screenshot changes were generated, validated, committed, and pushed successfully."
              echo
              echo "Repository settings currently prevent the Actions GITHUB_TOKEN from creating a pull request."
              echo
              echo "Open the protected-branch PR here: $compare_url"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$create_output" >&2
          exit "$create_status"
