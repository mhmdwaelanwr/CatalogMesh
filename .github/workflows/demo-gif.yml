name: generate-demo-gif

on:
  push:
    branches:
      - release/v3.1.0
    paths:
      - "scripts/build_demo_gif.py"
      - ".github/workflows/demo-gif.yml"
      - "docs/screenshots/actual/**"

permissions:
  contents: write

concurrency:
  group: demo-gif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"

      - name: Generate demo GIF from real screenshots
        run: python scripts/build_demo_gif.py

      - name: Commit generated demo
        shell: bash
        run: |
          if git diff --quiet -- docs/demo.gif; then
            echo "Demo GIF is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "Generate README demo GIF"
          git push origin HEAD:${{ github.ref_name }}
