name: Bug report
description: Report a reproducible problem without sharing credentials or private images.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, `.env` contents, or private product images.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [GUI, CLI, Both]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove keys, paths, and private data first.
